# Gitleaks configuration: the default rules, plus two narrow exceptions.
#
# The repository pins public tokenizer files by SHA-256 (src/atti/frontier.py, src/atti/regional.py and the
# results/*_summary.json files). The generic-api-key rule reads those integrity hashes as secrets.
# Only that rule is relaxed, and only when a tokenizer-file key holds exactly 64 lowercase hex digits.
# The same rule also reads three public model identifiers used as adapter keys as secrets; only those
# exact values are allowed.

[extend]
useDefault = true

[[allowlists]]
description = "SHA-256 integrity pins of public tokenizer files"
targetRules = ["generic-api-key"]
regexTarget = "match"
regexes = [
  '''(?:tokenizer\.json|tokenizer_config\.json|tiktoken\.model|tokenizer\.model|tokenizer_json_sha256)"\s*:\s*"[0-9a-f]{64}"''',
]

[[allowlists]]
description = "Public model identifiers used as adapter keys (exact values only)"
targetRules = ["generic-api-key"]
regexTarget = "secret"
regexes = [
  '''^(?:k2-horizon-375b-a23b|fanar-2-27b-instruct|arabiangpt-08b-v2)$''',
]
