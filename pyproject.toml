[project]
name = "atti"
version = "0.2.0"
description = "Arabic Token Tax Index: Arabic/English token-count comparison on parallel Saudi legal texts"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "tokenizers==0.22.1",
    "huggingface-hub==0.36.0",
    "pdfminer.six==20260107",
    "truststore==0.10.4",
    "pymupdf==1.26.7",
    "httpx==0.28.1",
    "selectolax==0.4.0",
    "tiktoken==0.12.0",
    "regex==2025.11.3",
]

[project.scripts]
atti = "atti.cli:main"

[dependency-groups]
dev = ["pytest>=8"]
regional = [
    "sentencepiece==0.2.1",
]

[tool.uv]
# regional: official SentencePiece runtime for `atti regional` only (not a dependency of the package)
default-groups = ["dev", "regional"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atti"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs cached sources/tokenizers (downloads on first run)"]
