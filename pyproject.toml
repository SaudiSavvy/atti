[project]
name = "atti"
version = "0.1.0"
description = "Arabic Token Tax Index: Arabic/English token-count comparison on parallel Saudi legal texts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "tokenizers==0.22.1",
    "huggingface-hub==0.36.0",
    "pdfminer.six==20250506",
    "truststore==0.10.4",
    "pymupdf==1.26.5",
    "httpx==0.28.1",
    "selectolax==0.4.0",
]

[project.scripts]
atti = "atti.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atti"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs cached sources/tokenizers (downloads on first run)"]
